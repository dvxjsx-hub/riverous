<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>riverous</title>

    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div id="app">
      <header id="topbar">
        <span id="brand">riverous</span>
      </header>

      <main id="main">
        <section id="screen">
          <div id="welcome">
            <h>RIVEROUS GAMES</h>
            <hr>
          </div>

          <div id="login">
            <h2>INICIAR SESIÓN</h2>
            <input id="username" type="text" placeHolder="USUARIO">
            <button id="enter-btn">ENTRAR</button>
          </div>

          <div id="home">
            <h2>RIVEROUSPLAY</h2>
          </div>

          <div id="menu">
            <button id="gravityrun">GRAVITY RUN</button>
            <button id="settings-btn">CONFIGURACIÓN</button>
          </div>

          <div id="gravityrun">
            <h3>JUGAR</h3>
          </div>
          <button id="close-menu-btn">VOLVER</button>

          <div id="settings-menu">
            <h3>CONFIGURACIÓN</h3>
            <button id="close-settings-btn">CERRAR</button>
          </div>
        </section>
      </main>

      <h1>riverous</h1>
    </div>

    <script src="script.js"></script>
  </body>
</html>
